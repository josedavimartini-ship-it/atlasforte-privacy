name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.API_BASE }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run E2E tests
        run: |
          pytest tests/e2e -q
