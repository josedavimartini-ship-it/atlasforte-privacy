name: Smoke test — OAuth endpoint

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL'
        required: false
        default: 'https://planilha-financeira-fam-lia-davi-martini.onrender.com'
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC (adjust if needed)

jobs:
  smoke-oauth:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ inputs.api_base }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests
      - name: Run OAuth smoke test
        env:
          API_BASE: ${{ env.API_BASE }}
        run: python tests/smoke_oauth_google.py
